# HTTPS で配信（/etc/nginx/certs に server.crt・server.key があるとき）
# __HTTPS_SUFFIX__ は起動時に 40-netconfig-tls.sh が置き換える（443 以外のときの ":ポート"）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

include /etc/nginx/netconfig/csp.inc;

# HTTP はルート CA の配布以外すべて HTTPS へ転送する
server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/netconfig/ca.inc;

    location / {
        return 301 https://$host__HTTPS_SUFFIX__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # step-ca で発行した証明書（中間 CA を含むチェーン）と秘密鍵
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:NCM_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: 一度 HTTPS で開いたブラウザは、期間中このホストへ HTTP ではなく HTTPS で接続する（HTTPS のときだけ付ける）
    #   max-age は 1 日。自己管理の CA の証明書で運用しており、証明書の期限切れ・CA の入れ替えで
    #   HTTPS が使えなくなったとき（HSTS の期間中はブラウザの「続行」も出ない）に入れなくなる期間を短くするため
    #   includeSubDomains（社内のほかのサブドメインを巻き込む）と preload（ブラウザへの登録。取り消しが難しい）は付けない
    #   IP アドレスで開いている場合、ブラウザは HSTS を記録しない（ホスト名で開いたときだけ効く）
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/netconfig/ca.inc;
    include /etc/nginx/netconfig/common.inc;
}
