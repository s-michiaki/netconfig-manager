# HTTPS で配信（/etc/nginx/certs に server.crt・server.key があるとき）
# __HTTPS_SUFFIX__ は起動時に 40-netconfig-tls.sh が置き換える（443 以外のときの ":ポート"）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP はルート CA の配布以外すべて HTTPS へ転送する
server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/netconfig/ca.inc;

    location / {
        return 301 https://$host__HTTPS_SUFFIX__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # step-ca で発行した証明書（中間 CA を含むチェーン）と秘密鍵
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:NCM_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/netconfig/ca.inc;
    include /etc/nginx/netconfig/common.inc;
}
