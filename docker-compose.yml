# 開発用構成（ソースをマウントしてホットリロード）
# 本番は docker-compose.prod.yml を使用すること
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://netconfig:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}@db:5432/netconfig
  REDIS_URL: redis://redis:6379/0
  GIT_REPO_PATH: /app/configs
  SSH_KNOWN_HOSTS: /data/ssh/known_hosts
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY を .env に設定してください}
  DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:?DEVICE_ENCRYPTION_KEY を .env に設定してください}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SSH_HOST_KEY_POLICY: ${SSH_HOST_KEY_POLICY:-tofu}
  SSH_READ_TIMEOUT: ${SSH_READ_TIMEOUT:-120}
  TERMINAL_LOG_PATH: /data/terminal-logs
  AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
  TERMINAL_LOG_RETENTION_DAYS: ${TERMINAL_LOG_RETENTION_DAYS:-180}
  ACTIVITY_LOG_RETENTION_DAYS: ${ACTIVITY_LOG_RETENTION_DAYS:-90}
  ACTIVITY_LOG_UNCHANGED: ${ACTIVITY_LOG_UNCHANGED:-true}
  PING_TIMEOUT: ${PING_TIMEOUT:-1}
  PING_MAX_TARGETS: ${PING_MAX_TARGETS:-300}
  PING_MONITOR_INTERVAL_SEC: ${PING_MONITOR_INTERVAL_SEC:-60}
  PING_ALERT_AFTER: ${PING_ALERT_AFTER:-3}
  PING_HISTORY_DAYS: ${PING_HISTORY_DAYS:-14}
  REPORT_HOUR: ${REPORT_HOUR:-8}
  GIT_EXPORT_URL: ${GIT_EXPORT_URL:-}
  GIT_EXPORT_BRANCH: ${GIT_EXPORT_BRANCH:-main}
  GIT_EXPORT_USERNAME: ${GIT_EXPORT_USERNAME:-}
  GIT_EXPORT_TOKEN: ${GIT_EXPORT_TOKEN:-}
  GIT_EXPORT_SSH_KEY: ${GIT_EXPORT_SSH_KEY:-}
  GIT_EXPORT_CA_FILE: ${GIT_EXPORT_CA_FILE:-}
  GIT_EXPORT_DELAY_SEC: ${GIT_EXPORT_DELAY_SEC:-60}
  MFA_ISSUER: ${MFA_ISSUER:-NetConfig Manager}
  PUBLIC_URL: ${PUBLIC_URL:-}
  TERMINAL_LOG_ENCRYPT: ${TERMINAL_LOG_ENCRYPT:-true}
  TERMINAL_LOG_TEXT: ${TERMINAL_LOG_TEXT:-true}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
  LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-20}
  LOGIN_FAILURE_WINDOW_MIN: ${LOGIN_FAILURE_WINDOW_MIN:-10}
  LOGIN_LOCK_MIN: ${LOGIN_LOCK_MIN:-15}
  API_TOKENS_ENABLED: ${API_TOKENS_ENABLED:-true}
  API_TOKEN_MAX_DAYS: ${API_TOKEN_MAX_DAYS:-365}
  COMPLIANCE_REGEX_TIMEOUT: ${COMPLIANCE_REGEX_TIMEOUT:-2}
  COMPLIANCE_CHECK_CONCURRENCY: ${COMPLIANCE_CHECK_CONCURRENCY:-2}
  IGNORE_RULE_TIMEOUT: ${IGNORE_RULE_TIMEOUT:-1}
  IGNORE_TOTAL_TIMEOUT: ${IGNORE_TOTAL_TIMEOUT:-5}
  # 収集失敗の通知をまとめる時間（秒。0 で機器ごとにすぐ）
  NOTIFY_FAILURE_BATCH_SEC: ${NOTIFY_FAILURE_BATCH_SEC:-60}
  # 変更の確認: 「未確認の変更」を数える期間（日数）
  CHANGE_REVIEW_DAYS: ${CHANGE_REVIEW_DAYS:-30}
  # システムの状態の確認と異常の通知
  SYSTEM_WATCHDOG_ENABLED: ${SYSTEM_WATCHDOG_ENABLED:-true}
  SYSTEM_ALERT_AFTER_MIN: ${SYSTEM_ALERT_AFTER_MIN:-10}
  SYSTEM_STALE_DAYS: ${SYSTEM_STALE_DAYS:-7}
  SYSTEM_CERT_ENDPOINT: ${SYSTEM_CERT_ENDPOINT:-frontend:443}
  BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-36}
  IMAGE_STALE_DAYS: ${IMAGE_STALE_DAYS:-60}
  SEARCH_MAX_PER_USER: ${SEARCH_MAX_PER_USER:-2}
  SEARCH_MAX_CONCURRENT: ${SEARCH_MAX_CONCURRENT:-4}
  # 機器台帳の自動取得（収集のついでに show version などを実行）
  INVENTORY_ENABLED: ${INVENTORY_ENABLED:-true}
  STARTUP_CHECK_ENABLED: ${STARTUP_CHECK_ENABLED:-true}
  STARTUP_CHECK_TIMEOUT: ${STARTUP_CHECK_TIMEOUT:-30}
  # コマンド実行（表示コマンドの一括実行）
  COMMAND_RUN_ENABLED: ${COMMAND_RUN_ENABLED:-true}
  COMMAND_RUN_MAX_DEVICES: ${COMMAND_RUN_MAX_DEVICES:-100}
  COMMAND_RUN_CONCURRENCY: ${COMMAND_RUN_CONCURRENCY:-10}
  COMMAND_RUN_MAX_OUTPUT: ${COMMAND_RUN_MAX_OUTPUT:-200000}
  COMMAND_RUN_MAX_RUN_OUTPUT: ${COMMAND_RUN_MAX_RUN_OUTPUT:-20000000}
  COMMAND_RUN_MAX_ACTIVE_PER_USER: ${COMMAND_RUN_MAX_ACTIVE_PER_USER:-2}
  COMMAND_RUN_MAX_ACTIVE: ${COMMAND_RUN_MAX_ACTIVE:-5}
  COMMAND_RUN_RETENTION_DAYS: ${COMMAND_RUN_RETENTION_DAYS:-30}
  # モニタリング（試験導入。既定は無効）
  MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
  MONITOR_INTERVAL_SEC: ${MONITOR_INTERVAL_SEC:-300}
  MONITOR_RETENTION_DAYS: ${MONITOR_RETENTION_DAYS:-30}
  MONITOR_FW_INTERVAL_MIN: ${MONITOR_FW_INTERVAL_MIN:-60}
  MONITOR_PANOS_VSYS: ${MONITOR_PANOS_VSYS:-vsys1}
  # 脆弱性・サポート終了日の管理（既定は無効。有効にすると worker が外部へ HTTPS で接続する）
  VULN_ENABLED: ${VULN_ENABLED:-false}
  VULN_FETCH_HOUR: ${VULN_FETCH_HOUR:-4}
  VULN_SOURCES: ${VULN_SOURCES:-paloalto,kev,eol}
  # 外部への接続（Webhook・メールの OAuth のトークン・脆弱性情報）。プロキシ（http:// だけ）・プロキシを通さない宛先・
  # 追加で信頼する CA（ホストの certs-outbound/ に置いたファイルの名前。下の volumes で読み取り専用で渡す）
  OUTBOUND_PROXY: ${OUTBOUND_PROXY:-}
  OUTBOUND_NO_PROXY: ${OUTBOUND_NO_PROXY:-}
  OUTBOUND_CA_FILE: ${OUTBOUND_CA_FILE:-}
  # podman は、起動したプロセス（setup.sh など）のプロキシの環境変数をコンテナへ入れる。手で podman-compose up したときに
  # プロキシの認証情報がコンテナの環境に残らないよう、空で明示する（アプリは OUTBOUND_* だけを使う。空は「なし」と同じ）
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

x-backend-depends: &backend-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: netconfig
      POSTGRES_USER: netconfig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netconfig"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # Ping監視: サーバーから ICMP を送るための権限（特権ソケット / 非特権ソケットのどちらでも送れるようにする）
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    environment: *backend-env
    volumes:
      - ./backend:/app
      - config_repo:/app/configs
      - ssh_data:/data/ssh
      - terminal_logs:/data/terminal-logs
      # 外部への接続で追加で信頼する CA（OUTBOUND_CA_FILE）。certs/（nginx の秘密鍵）とは別のディレクトリ。
      # 3 つのコンテナで共有するので :z（小文字。大文字の Z は 1 つのコンテナ専用のラベルになり、ほかから読めなくなる）
      - ./certs-outbound:/etc/netconfig/outbound:ro,z
    depends_on: *backend-depends
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    # Ping監視の常時監視（worker が PING する）にも、backend と同じ ICMP の権限が要る
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    environment: *backend-env
    volumes:
      - ./backend:/app
      - config_repo:/app/configs
      - ssh_data:/data/ssh
      - terminal_logs:/data/terminal-logs
      # 外部への接続で追加で信頼する CA（OUTBOUND_CA_FILE）。certs/（nginx の秘密鍵）とは別のディレクトリ。
      # 3 つのコンテナで共有するので :z（小文字。大文字の Z は 1 つのコンテナ専用のラベルになり、ほかから読めなくなる）
      - ./certs-outbound:/etc/netconfig/outbound:ro,z
    depends_on: *backend-depends
    command: celery -A app.worker.celery_app worker --loglevel=info -c 4

  beat:
    build:
      context: ./backend
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./certs-outbound:/etc/netconfig/outbound:ro,z
    depends_on: *backend-depends
    # DBのスケジュールを毎分確認するタスク（dispatch_due_schedules）を起動する
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Vite 開発サーバーが /api を backend コンテナへ中継する
      API_PROXY_TARGET: http://backend:8000
      # プロキシの環境変数は空で明示する（x-backend-env と同じ理由。nginx・vite は外へ出ない）
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  config_repo:
  ssh_data:
  terminal_logs:
