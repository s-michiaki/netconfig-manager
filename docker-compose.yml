# 開発用構成（ソースをマウントしてホットリロード）
# 本番は docker-compose.prod.yml を使用すること
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://netconfig:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}@db:5432/netconfig
  REDIS_URL: redis://redis:6379/0
  GIT_REPO_PATH: /app/configs
  SSH_KNOWN_HOSTS: /data/ssh/known_hosts
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY を .env に設定してください}
  DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:?DEVICE_ENCRYPTION_KEY を .env に設定してください}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SSH_HOST_KEY_POLICY: ${SSH_HOST_KEY_POLICY:-tofu}
  SSH_READ_TIMEOUT: ${SSH_READ_TIMEOUT:-120}
  TERMINAL_LOG_PATH: /data/terminal-logs
  AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
  TERMINAL_LOG_RETENTION_DAYS: ${TERMINAL_LOG_RETENTION_DAYS:-180}
  PING_TIMEOUT: ${PING_TIMEOUT:-1}
  PING_MAX_TARGETS: ${PING_MAX_TARGETS:-300}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

x-backend-depends: &backend-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: netconfig
      POSTGRES_USER: netconfig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netconfig"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # Ping監視: サーバーから ICMP を送るための権限（特権ソケット / 非特権ソケットのどちらでも送れるようにする）
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    environment: *backend-env
    volumes:
      - ./backend:/app
      - config_repo:/app/configs
      - ssh_data:/data/ssh
      - terminal_logs:/data/terminal-logs
    depends_on: *backend-depends
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    environment: *backend-env
    volumes:
      - ./backend:/app
      - config_repo:/app/configs
      - ssh_data:/data/ssh
      - terminal_logs:/data/terminal-logs
    depends_on: *backend-depends
    command: celery -A app.worker.celery_app worker --loglevel=info -c 4

  beat:
    build:
      context: ./backend
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on: *backend-depends
    # DBのスケジュールを毎分確認するタスク（dispatch_due_schedules）を起動する
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Vite 開発サーバーが /api を backend コンテナへ中継する
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  config_repo:
  ssh_data:
  terminal_logs:
