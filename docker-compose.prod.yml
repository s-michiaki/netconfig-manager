# 本番用構成
#   docker compose -f docker-compose.prod.yml up -d --build
# - ソースのマウント・--reload なし
# - フロントはビルド済み静的ファイルを nginx で配信し、/api を backend に中継
# - 外部に公開するのは nginx の HTTP / HTTPS ポートのみ（backend / DB / Redis は内部ネットワークのみ）
# - HTTPS は certs/ に証明書を置くと有効になる（scripts/import_cert.sh。無ければ HTTP のみ）
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://netconfig:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}@db:5432/netconfig
  REDIS_URL: redis://redis:6379/0
  GIT_REPO_PATH: /app/configs
  SSH_KNOWN_HOSTS: /data/ssh/known_hosts
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY を .env に設定してください}
  DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:?DEVICE_ENCRYPTION_KEY を .env に設定してください}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SSH_HOST_KEY_POLICY: ${SSH_HOST_KEY_POLICY:-tofu}
  SSH_READ_TIMEOUT: ${SSH_READ_TIMEOUT:-120}
  TERMINAL_LOG_PATH: /data/terminal-logs
  AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
  TERMINAL_LOG_RETENTION_DAYS: ${TERMINAL_LOG_RETENTION_DAYS:-180}
  PING_TIMEOUT: ${PING_TIMEOUT:-1}
  PING_MAX_TARGETS: ${PING_MAX_TARGETS:-300}
  ALLOWED_ORIGINS: ""

x-backend-depends: &backend-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netconfig
      POSTGRES_USER: netconfig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netconfig"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Ping監視: サーバーから ICMP を送るための権限（特権ソケット / 非特権ソケットのどちらでも送れるようにする）
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    environment: *backend-env
    volumes:
      - config_repo:/app/configs
      - ssh_data:/data/ssh
      - terminal_logs:/data/terminal-logs
    depends_on: *backend-depends
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - config_repo:/app/configs
      - ssh_data:/data/ssh
      - terminal_logs:/data/terminal-logs
    depends_on: *backend-depends
    command: celery -A app.worker.celery_app worker --loglevel=info -c 4

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-env
    depends_on: *backend-depends
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    environment:
      # HTTP から HTTPS へ転送するときのポート（外から見たポート番号）
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # HTTPS の証明書（scripts/import_cert.sh で server.crt / server.key / ca.crt を配置）。
      # 無ければ HTTP だけで起動する。:Z は SELinux のラベル付け
      - ./certs:/etc/nginx/certs:ro,Z
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  config_repo:
  ssh_data:
  terminal_logs:
