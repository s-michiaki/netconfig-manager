# 本番用構成
#   docker compose -f docker-compose.prod.yml up -d --build
# - ソースのマウント・--reload なし
# - フロントはビルド済み静的ファイルを nginx で配信し、/api を backend に中継
# - 外部に公開するのは nginx の HTTP ポートのみ（backend / DB / Redis は内部ネットワークのみ）
# - HTTPS は前段のロードバランサー / リバースプロキシで終端すること
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://netconfig:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}@db:5432/netconfig
  REDIS_URL: redis://redis:6379/0
  GIT_REPO_PATH: /app/configs
  SSH_KNOWN_HOSTS: /data/ssh/known_hosts
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY を .env に設定してください}
  DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:?DEVICE_ENCRYPTION_KEY を .env に設定してください}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SSH_HOST_KEY_POLICY: ${SSH_HOST_KEY_POLICY:-tofu}
  ALLOWED_ORIGINS: ""

x-backend-depends: &backend-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netconfig
      POSTGRES_USER: netconfig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netconfig"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - config_repo:/app/configs
      - ssh_data:/data/ssh
    depends_on: *backend-depends
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - config_repo:/app/configs
      - ssh_data:/data/ssh
    depends_on: *backend-depends
    command: celery -A app.worker.celery_app worker --loglevel=info -c 4

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-env
    depends_on: *backend-depends
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  config_repo:
  ssh_data:
