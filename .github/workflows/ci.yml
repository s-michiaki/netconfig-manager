# プッシュ・プルリクエストごとにテストとビルドを実行する
#   backend : ロックファイルの確認、ruff（リンター）と pytest（SQLite・fakeredis・テスト用 SSH サーバーを使うので DB / Redis は不要）
#   frontend: 型チェック（tsc）と本番ビルド（vite build）
#   e2e     : 画面テスト（Playwright。backend を SQLite で起動し、初期データを入れて Chromium で操作する）
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 本番のコンテナ（python:3.12-slim）と合わせる
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: 依存パッケージのインストール
        # requirements-dev.txt はロックファイル（本番の依存も同じ版で含む）
        run: pip install --require-hashes -r requirements-dev.txt
      - name: ロックファイルが requirements*.in と合っているか
        # .in を変えたのにロックを生成し直していない・ロックを手で書き換えた、を検出する
        run: |
          pip install uv==0.11.32
          bash ../scripts/lock_deps.sh --check
      - name: ruff（リンター）
        run: ruff check --output-format=github .
      - name: 導入・運用スクリプトの構文検査（bash -n）
        # AlmaLinux / Ubuntu の両方で使うスクリプト。OS ごとの動きのテストは pytest の tests/test_os_scripts.py
        working-directory: .
        run: |
          for f in scripts/*.sh scripts/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: pytest
        # コンフィグ履歴のテストで git のコミットを作るため、ユーザー名を設定しておく
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"  # 本番のコンテナ（node:22-alpine）と合わせる
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存パッケージのインストール
        run: npm ci
      - name: 型チェック
        run: npx tsc -b
      - name: ビルド
        run: npx vite build

  nginx:
    # 本番と同じ nginx のイメージで設定を読み込み（nginx -t）、セキュリティヘッダーが付くことを確かめる
    #   HTTPS の設定に誤りがあると 40-netconfig-tls.sh が黙って HTTP に戻すため、HTTPS で起動したことも確認する
    #   backend は起動しない（/api や /docs は 502 になるが、ヘッダーは always 付きなので確認できる）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: docker.io/library/nginx:1.30-alpine  # frontend/Dockerfile の prod ステージと合わせる
      NGINX_MIN: 1.30.7  # 2026-11-18 公開の脆弱性（HTTP/2・TLS 1.3 など）の修正版（#17）
    steps:
      - uses: actions/checkout@v7
      - name: Dockerfile と同じイメージか・修正済みの版か
        run: |
          grep -qx "FROM $IMAGE AS prod" frontend/Dockerfile || { echo "frontend/Dockerfile の prod ステージと IMAGE が違います"; exit 1; }
          docker pull -q "$IMAGE"
          v=$(docker run --rm --entrypoint nginx "$IMAGE" -v 2>&1 | grep -o 'nginx/[0-9.]*' | head -1 | cut -d/ -f2)
          echo "nginx $v"
          [ "$(printf '%s\n%s\n' "$NGINX_MIN" "$v" | sort -V | head -1)" = "$NGINX_MIN" ] \
            || { echo "nginx $v は $NGINX_MIN より古い（脆弱性が未修正）"; exit 1; }
      - name: 確認用の証明書と HTML を用意
        run: |
          mkdir -p /tmp/ncm/certs /tmp/ncm/html
          echo '<!doctype html><title>ok</title>' > /tmp/ncm/html/index.html
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout /tmp/ncm/certs/server.key -out /tmp/ncm/certs/server.crt
      - name: HTTPS（証明書あり）で起動して確認
        run: |
          docker run -d --name ncm-https --add-host backend:127.0.0.1 -e HTTPS_PORT=8443 -p 8080:80 -p 8443:443 \
            -v "$PWD/frontend/nginx:/etc/nginx/netconfig:ro" -v /tmp/ncm/certs:/etc/nginx/certs:ro \
            -v /tmp/ncm/html:/usr/share/nginx/html:ro \
            "$IMAGE" sh -c "sh /etc/nginx/netconfig/40-netconfig-tls.sh && nginx -t && exec nginx -g 'daemon off;'"
          sleep 3
          docker logs ncm-https 2>&1 | tee /tmp/ncm/https.log
          grep -q "HTTPS で起動します" /tmp/ncm/https.log
          grep -q "test is successful" /tmp/ncm/https.log
          h() { curl -sk -o /dev/null -D - "$1" | tr -d '\r'; }
          h https://127.0.0.1:8443/ | tee /tmp/ncm/top
          grep -qix "strict-transport-security: max-age=86400" /tmp/ncm/top
          grep -qi "^content-security-policy: default-src 'self'; script-src 'self';" /tmp/ncm/top
          grep -qi "^x-content-type-options: nosniff" /tmp/ncm/top
          grep -qi "^x-frame-options: DENY" /tmp/ncm/top
          grep -qi "^referrer-policy: same-origin" /tmp/ncm/top
          grep -qi "^permissions-policy: " /tmp/ncm/top
          h https://127.0.0.1:8443/docs | tee /tmp/ncm/docs
          grep -qi "^content-security-policy: .*https://cdn.jsdelivr.net" /tmp/ncm/docs
          grep -qi "^strict-transport-security: " /tmp/ncm/docs
          h https://127.0.0.1:8443/api/health | grep -qi "^content-security-policy: default-src 'self'; script-src 'self';"
          # HTTP は HTTPS へ転送するだけで、HSTS は付けない（HTTP の応答の HSTS はブラウザが無視する）
          h http://127.0.0.1:8080/ | tee /tmp/ncm/http
          grep -qi "^location: https://127.0.0.1:8443/" /tmp/ncm/http
          if grep -qi "strict-transport-security" /tmp/ncm/http; then echo "HTTP の応答に HSTS が付いている"; exit 1; fi
      - name: HTTP（証明書なし）で起動して確認
        run: |
          docker run -d --name ncm-http --add-host backend:127.0.0.1 -p 8081:80 \
            -v "$PWD/frontend/nginx:/etc/nginx/netconfig:ro" -v /tmp/ncm/html:/usr/share/nginx/html:ro \
            "$IMAGE" sh -c "sh /etc/nginx/netconfig/40-netconfig-tls.sh && nginx -t && exec nginx -g 'daemon off;'"
          sleep 3
          docker logs ncm-http 2>&1 | grep -q "証明書が無いため HTTP で起動します"
          curl -s -o /dev/null -D - http://127.0.0.1:8081/ | tr -d '\r' | tee /tmp/ncm/plain
          grep -qi "^content-security-policy: default-src 'self'; script-src 'self';" /tmp/ncm/plain
          if grep -qi "strict-transport-security" /tmp/ncm/plain; then echo "HTTP の応答に HSTS が付いている"; exit 1; fi
      - name: 失敗時のログ
        if: failure()
        run: docker logs ncm-https 2>&1 || true; docker logs ncm-http 2>&1 || true

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存パッケージのインストール
        run: |
          pip install --require-hashes -r ../backend/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: 画面テスト
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          npm run e2e
      - name: 失敗時のレポート
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
