# プッシュ・プルリクエストごとにテストとビルドを実行する
#   backend : ruff（リンター）と pytest（SQLite・fakeredis・テスト用 SSH サーバーを使うので DB / Redis は不要）
#   frontend: 型チェック（tsc）と本番ビルド（vite build）
#   e2e     : 画面テスト（Playwright。backend を SQLite で起動し、初期データを入れて Chromium で操作する）
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 本番のコンテナ（python:3.12-slim）と合わせる
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff（リンター）
        run: ruff check --output-format=github .
      - name: pytest
        # コンフィグ履歴のテストで git のコミットを作るため、ユーザー名を設定しておく
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"  # 本番のコンテナ（node:20-alpine）と合わせる
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存パッケージのインストール
        run: npm ci
      - name: 型チェック
        run: npx tsc -b
      - name: ビルド
        run: npx vite build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存パッケージのインストール
        run: |
          pip install -r ../backend/requirements.txt -r ../backend/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: 画面テスト
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          npm run e2e
      - name: 失敗時のレポート
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
