# Alembic 設定（DB の接続先は環境変数 DATABASE_URL から読む）
#   新しいマイグレーションの作成:  alembic revision --autogenerate -m "説明"
#   手動で最新化:                  alembic upgrade head
# 通常は backend 起動時に自動で upgrade head が実行される（app/core/migrate.py）
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
